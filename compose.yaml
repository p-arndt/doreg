# Development dependencies: minisuite (OIDC via minicloak, S3 via minibucket,
# mail sink). doreg itself runs on the host with `just dev`, like the apps in
# the other repos. Copy .env.example to .env first. All URLs: http://localhost:9900.
services:
  suite:
    image: ghcr.io/p-arndt/minisuite:0.4.0
    restart: unless-stopped
    ports:
      # S3 (minibucket).
      - 127.0.0.1:9000:9000
      # OIDC provider (minicloak).
      - 127.0.0.1:9500:9500
      # Mail sink (minimail) and its web UI.
      - 127.0.0.1:8025:8025
      # Overview page.
      - 127.0.0.1:9900:9900
    environment:
      MINIBUCKET_ACCESS_KEY: minioadmin
      MINIBUCKET_SECRET_KEY: minioadmin
      MINIBUCKET_REGION: us-east-1
      MINICLOAK_ISSUER: http://localhost:9500/realms/dev
      # client_id=secret:redirect[,redirect]. 8080 is `just dev`, 5173 is `just web-dev`.
      MINICLOAK_CLIENT: 'doreg=doreg-dev-secret:http://localhost:8080/*,http://localhost:5173/*'
      # username=password:email:name:roles, several separated by ';'. Roles
      # become the `roles` and `realm_access.roles` claims. alice is the
      # registry admin; bob is a normal user to add to a project via a group.
      MINICLOAK_USER: 'alice=alice:alice@doreg.local:Alice Becker:registry-admin;bob=bob:bob@doreg.local:Bob Becker:team-dev'
    volumes:
      - suitedata:/data

  # Optional PostgreSQL for DATABASE_URL (SQLite in ./data is the default).
  # Tests use it with: just test-postgres
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doreg
      POSTGRES_PASSWORD: doreg
      POSTGRES_DB: doreg
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql

  # The docker daemon runs in a VM (Docker Desktop) and cannot reach a process
  # on the host's localhost:8080. This forwards localhost:5050, which the
  # daemon can reach as a published container port, to doreg on the host:
  #   docker push localhost:5050/team/api:dev
  push-proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: TCP-LISTEN:5050,fork,reuseaddr TCP:host.docker.internal:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:5050:5050

volumes:
  suitedata:
  pgdata:
