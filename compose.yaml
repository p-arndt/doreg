# Development stack: minisuite (OIDC, S3) plus doreg built from this repo.
# Copy .env.example to .env first. Overview of all URLs at http://localhost:9900.
#
# doreg shares the network namespace of the suite container. Inside doreg,
# localhost:9500 (OIDC) and localhost:9000 (S3) reach minisuite. The browser
# and the docker daemon reach doreg at localhost:5000 through the port that the
# suite service publishes, so no port is declared on doreg itself.
services:
  suite:
    image: ghcr.io/p-arndt/minisuite:0.4.0
    restart: unless-stopped
    ports:
      # S3 (minibucket).
      - 127.0.0.1:9000:9000
      # OIDC provider (minicloak).
      - 127.0.0.1:9500:9500
      # Mail sink (minimail) and its web UI.
      - 127.0.0.1:8025:8025
      # Overview page.
      - 127.0.0.1:9900:9900
      # doreg, published here because it runs in this network namespace.
      - 127.0.0.1:5000:5000
    environment:
      MINIBUCKET_ACCESS_KEY: minioadmin
      MINIBUCKET_SECRET_KEY: minioadmin
      MINIBUCKET_REGION: us-east-1
      MINICLOAK_ISSUER: http://localhost:9500/realms/dev
      # client_id=secret:redirect[,redirect]. 5000 is doreg, 5173 is `just web-dev`.
      MINICLOAK_CLIENT: 'doreg=doreg-dev-secret:http://localhost:5000/*,http://localhost:5173/*'
      # username=password:email:name:roles, several separated by ';'. Roles
      # become the `roles` and `realm_access.roles` claims. alice is the
      # registry admin; bob is a normal user to add to a project via a group.
      MINICLOAK_USER: 'alice=alice:alice@doreg.local:Alice Becker:registry-admin;bob=bob:bob@doreg.local:Bob Becker:team-dev'
    volumes:
      - suitedata:/data

  doreg:
    build: .
    restart: unless-stopped
    network_mode: "service:suite"
    env_file: .env
    volumes:
      - doreg-data:/data
    depends_on:
      - suite

volumes:
  suitedata:
  doreg-data:
