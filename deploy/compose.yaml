# Example deployment behind Traefik. Layer pushes can take minutes: raise the
# entrypoint's readTimeout (Traefik v3 defaults to 60s), e.g.
#   --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
# Fixed project name, so the volume is doreg_doreg-data regardless of the directory.
name: doreg

services:
  doreg:
    image: ghcr.io/p-arndt/doreg:latest
    restart: unless-stopped
    environment:
      # Creates this admin on first start if no users exist; remove afterwards.
      DOREG_ADMIN_USER: admin
      # Optional with SSO: without it the first SSO login becomes admin.
      DOREG_ADMIN_PASSWORD: ${DOREG_ADMIN_PASSWORD:-}
      # Single sign-on (optional). Uncomment to enable OIDC login. Register
      # https://reg.example.com/api/auth/oidc/callback as the redirect URI at the
      # provider. Keycloak: OIDC_ISSUER=https://sso.example.com/realms/<realm>.
      # OIDC_ISSUER: https://sso.example.com
      # OIDC_CLIENT_ID: doreg
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      # OIDC_REDIRECT_URI: https://reg.example.com/api/auth/oidc/callback
      # OIDC_PROVIDER_NAME: SSO
      # Members of this group or role become system admins.
      # OIDC_ADMIN_ROLE: doreg-admins
      # OIDC_ADMIN_EMAILS: you@example.com
      # Blobs on S3 instead of the data volume: see compose.s3.yaml.
    volumes:
      - doreg-data:/data
    ports:
      - "8080:8080"

volumes:
  doreg-data:
