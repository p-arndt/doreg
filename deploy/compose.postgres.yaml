# Example deployment with metadata in a bundled PostgreSQL instead of SQLite.
# Blobs and upload sessions stay on doreg-data; combine with compose.s3.yaml's
# S3_* settings to move blobs to a bucket. Run one doreg per database.
#
# Behind Traefik: layer pushes can take minutes, so raise the entrypoint's
# readTimeout (Traefik v3 defaults to 60s), e.g.
#   --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
#
# POSTGRES_PASSWORD goes into a URL: use only URL-safe characters
# (e.g. openssl rand -hex 24).
#   POSTGRES_PASSWORD=... DOREG_ADMIN_PASSWORD=... \
#     docker compose -f compose.postgres.yaml up -d

# Fixed project name, so volumes are doreg_* regardless of the directory.
name: doreg

services:
  doreg:
    image: ghcr.io/p-arndt/doreg:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Creates this admin on first start if no users exist; remove afterwards.
      DOREG_ADMIN_USER: admin
      # Optional with SSO: without it the first SSO login becomes admin.
      DOREG_ADMIN_PASSWORD: ${DOREG_ADMIN_PASSWORD:-}
      # Single sign-on (optional). Uncomment to enable OIDC login. Register
      # https://reg.example.com/api/auth/oidc/callback as the redirect URI at the
      # provider. Keycloak: OIDC_ISSUER=https://sso.example.com/realms/<realm>.
      # OIDC_ISSUER: https://sso.example.com
      # OIDC_CLIENT_ID: doreg
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      # OIDC_REDIRECT_URI: https://reg.example.com/api/auth/oidc/callback
      # OIDC_PROVIDER_NAME: SSO
      # Members of this group or role become system admins.
      # OIDC_ADMIN_ROLE: doreg-admins
      # OIDC_ADMIN_EMAILS: you@example.com
      # Metadata in PostgreSQL; doreg creates the schema on start.
      DATABASE_URL: postgres://doreg:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/doreg?sslmode=disable
    volumes:
      - doreg-data:/data
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doreg
      POSTGRES_DB: doreg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "doreg", "-d", "doreg"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  doreg-data:
  postgres-data:
